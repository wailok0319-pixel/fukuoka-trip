<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 1. 文件編碼與響應式視圖設定 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡 6 天 5 夜行程助手</title>
    
    <!-- 2. CSS 樣式設定：手機 App 風格與自然系配色 -->
    <style>
        :root {
            --primary: #4A6B5D;       /* 主色：自然橄欖綠 */
            --primary-light: #E8EFEA; /* 淺綠底色 */
            --bg: #F7F6F2;            /* 背景：柔和米白 */
            --card-bg: #FFFFFF;       /* 卡片：純白 */
            --text-main: #2C3E35;     /* 主文字顏色 */
            --text-sub: #6B7C72;      /* 次要文字顏色 */
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            padding-bottom: 40px;
        }

        /* 頂部標頭與狀態顯示 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            color: var(--text-sub);
        }

        /* 匯率計算器卡片 */
        .calculator-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .calc-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .input-group input {
            padding: 8px 12px;
            border: 1px solid #E0E5E2;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        /* 日期選擇按鈕區 */
        .date-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .date-nav::-webkit-scrollbar {
            display: none;
        }

        .date-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid #E0E5E2;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .date-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(74, 107, 93, 0.3);
        }

        /* 行程時間軸與卡片 */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .time-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .spot-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .traffic-box {
            background: #F9FAF9;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.825rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            line-height: 1.4;
            border: 1px dashed #DCE4E0;
        }

        .notes-box {
            font-size: 0.825rem;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header 區塊 -->
    <header>
        <h1>福岡行程助手</h1>
        <div id="status-badge" class="status-badge">💾 已儲存</div>
    </header>

    <!-- 匯率計算器區塊 -->
    <div class="calculator-card">
        <div class="card-title">
            <span>💱 雙向匯率計算器</span>
            <span style="font-size: 0.75rem; color: var(--text-sub);">1 JPY = 0.052 HKD</span>
        </div>
        <div class="calc-inputs">
            <div class="input-group">
                <label for="jpy-input">日圓 (JPY ¥)</label>
                <input type="number" id="jpy-input" placeholder="0" oninput="convertCurrency('JPY')">
            </div>
            <div class="input-group">
                <label for="hkd-input">港幣 (HKD $)</label>
                <input type="number" id="hkd-input" placeholder="0" oninput="convertCurrency('HKD')">
            </div>
        </div>
    </div>

    <!-- 日期導覽按鈕區塊 -->
    <div class="date-nav" id="date-nav"></div>

    <!-- 行程動態列表區塊 -->
    <div class="timeline" id="timeline"></div>
</div>

<!-- 3. JavaScript 邏輯：狀態管理、LocalStorage 儲存與事件處理 -->
<script>
    // 系統版本號與 LocalStorage 儲存 Key
    const APP_VERSION = "1.0.0";
    const STORAGE_KEY = "fukuoka_trip_data_v1";

    // 匯率預設值：1 JPY = 0.052 HKD
    let exchangeRate = 0.052;

    // 預設行程資料
    const initialItinerary = {
        "Day 1 (10/5)": [
            {
                time: "15:00",
                title: "抵達福岡機場 ➔ 飯店 Check-in",
                traffic: "🚇 地鐵：空港線至博多站，轉七隈線至「渡邊通站」(2號出口，車資 ¥470)",
                notes: "福岡蒙特埃馬納酒店辦理入住、卸下行李。",
                searchQuery: "Hotel Monterey La Soeur Fukuoka"
            },
            {
                time: "16:30",
                title: "祇園周邊輕鬆散步",
                traffic: "🚶 步行：渡邊通 ➔ 祇園約 12-15 分鐘",
                notes: "• Full Full 明太子麵包（10:00-19:00）\n• FUK COFFEE（08:00-20:00）\n• 櫛田神社（17:00 關門）",
                searchQuery: "櫛田神社"
            }
        ],
        "Day 2 (10/6)": [
            {
                time: "09:30",
                title: "前往 THE OUTLETS KITAKYUSHU",
                traffic: "🚇 地鐵：渡邊通 ➔ 博多（¥210）\n🚆 JR：博多 ➔ スペースワールド站（¥1,130）",
                notes: "JR 快速列車每小時 3-4 班，車程約 60 分鐘。",
                searchQuery: "THE OUTLETS KITAKYUSHU"
            }
        ]
    };

    // 應用程式狀態管理
    let appState = {
        version: APP_VERSION,
        selectedDate: "Day 1 (10/5)",
        itinerary: initialItinerary
    };

    // 自動儲存至 LocalStorage
    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            const badge = document.getElementById("status-badge");
            badge.textContent = "💾 已儲存";
            badge.style.color = "var(--primary)";
        } catch (e) {
            const badge = document.getElementById("status-badge");
            badge.textContent = "⚠️ 儲存失敗";
            badge.style.color = "#d9534f";
        }
    }

    // 從 LocalStorage 還原資料
    function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.version === APP_VERSION) {
                    appState = parsed;
                }
            } catch (e) {
                console.error("解析 LocalStorage 資料失敗", e);
            }
        }
    }

    // 雙向匯率計算邏輯
    function convertCurrency(source) {
        const jpyInput = document.getElementById("jpy-input");
        const hkdInput = document.getElementById("hkd-input");

        if (source === 'JPY') {
            const val = parseFloat(jpyInput.value);
            hkdInput.value = isNaN(val) ? "" : (val * exchangeRate).toFixed(1);
        } else {
            const val = parseFloat(hkdInput.value);
            jpyInput.value = isNaN(val) ? "" : Math.round(val / exchangeRate);
        }
    }

    // 渲染日期選單
    function renderDateNav() {
        const nav = document.getElementById("date-nav");
        nav.innerHTML = "";

        Object.keys(appState.itinerary).forEach(dateKey => {
            const btn = document.createElement("button");
            btn.className = `date-btn ${dateKey === appState.selectedDate ? 'active' : ''}`;
            btn.textContent = dateKey;
            btn.onclick = () => {
                appState.selectedDate = dateKey;
                saveState();
                renderDateNav();
                renderTimeline();
            };
            nav.appendChild(btn);
        });
    }

    // 渲染行程卡片列表
    function renderTimeline() {
        const container = document.getElementById("timeline");
        container.innerHTML = "";

        const items = appState.itinerary[appState.selectedDate] || [];

        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "item-card";

            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.searchQuery || item.title)}`;

            card.innerHTML = `
                <div class="time-badge">${item.time}</div>
                <div class="spot-name">${item.title}</div>
                <div class="traffic-box">${item.traffic}</div>
                <div class="notes-box">${item.notes.replace(/\n/g, '<br>')}</div>
                <div class="card-actions">
                    <a href="${mapUrl}" target="_blank" class="btn-map">📍 地圖導航</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 初始化應用程式
    function init() {
        loadState();
        renderDateNav();
        renderTimeline();
    }

    init();
</script>
</body>
</html>
