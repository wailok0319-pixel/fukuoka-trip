<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡 6 天 5 夜行程助手</title>
    <style>
        :root {
            --primary: #4A6B5D;       /* 自然橄欖綠 */
            --primary-light: #E8EFEA; /* 淺綠底色 */
            --bg: #F7F6F2;            /* 柔和米白背景 */
            --card-bg: #FFFFFF;       /* 純白卡片 */
            --text-main: #2C3E35;     /* 主要文字 */
            --text-sub: #6B7C72;      /* 次要文字 */
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            color: var(--text-sub);
        }

        .btn-reset {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: #E74C3C;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* 匯率計算器卡片 */
        .calculator-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .calc-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .input-group input {
            padding: 8px 12px;
            border: 1px solid #E0E5E2;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        /* 3 欄日期選擇矩陣 */
        .date-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .date-btn {
            width: 100%;
            padding: 8px 4px;
            background: var(--card-bg);
            border: 1px solid #E0E5E2;
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--text-sub);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .date-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(74, 107, 93, 0.3);
        }

        /* 天氣預報卡片 CSS */
        .weather-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F2F7F4 100%);
            border: 1px solid #DCE5E0;
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            font-size: 2rem;
        }

        .weather-temp {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .weather-status {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .weather-tip {
            font-size: 0.75rem;
            color: #555;
            background: #E8EFEA;
            padding: 6px 10px;
            border-radius: 8px;
            max-width: 160px;
            text-align: right;
            line-height: 1.3;
        }

        /* 交通提示卡片 */
        .day-summary-card {
            background: var(--primary-light);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.825rem;
            color: var(--primary);
            margin-bottom: 16px;
            line-height: 1.4;
            font-weight: 500;
        }

        /* 行程時間軸 */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .time-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .spot-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .traffic-box {
            background: #F9FAF9;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.825rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            line-height: 1.4;
            border: 1px dashed #DCE4E0;
        }

        .notes-box {
            font-size: 0.825rem;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>

    let appState = {
        version: APP_VERSION,
        selectedDate: "Day 1 (10/5)",
        itinerary: initialItinerary
    };

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            const badge = document.getElementById("status-badge");
            badge.textContent = "💾 已儲存";
            badge.style.color = "var(--primary)";
        } catch (e) {
            const badge = document.getElementById("status-badge");
            badge.textContent = "⚠️ 儲存失敗";
            badge.style.color = "#d9534f";
        }
    }

    function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.version === APP_VERSION) {
                    appState = parsed;
                } else {
                    resetToDefault();
                }
            } catch (e) {
                resetToDefault();
            }
        } else {
            saveState();
        }
    }

    function resetToDefault() {
        appState = {
            version: APP_VERSION,
            selectedDate: "Day 1 (10/5)",
            itinerary: JSON.parse(JSON.stringify(initialItinerary))
        };
        saveState();
        renderDateNav();
        renderTimeline();
    }

        const hkdInput = document.getElementById("hkd-input");
        if (source === 'JPY') {
            const val = parseFloat(jpyInput.value);
            hkdInput.value = isNaN(val) ? "" : (val * exchangeRate).toFixed(1);
        } else {
            const val = parseFloat(hkdInput.value);
            jpyInput.value = isNaN(val) ? "" : Math.round(val / exchangeRate);
        }
    }

    function renderDateNav() {
        const nav = document.getElementById("date-nav");
        nav.innerHTML = "";
        Object.keys(appState.itinerary).forEach(dateKey => {
            const btn = document.createElement("button");
            btn.className = `date-btn ${dateKey === appState.selectedDate ? 'active' : ''}`;
            btn.textContent = dateKey;
            btn.onclick = () => {
                appState.selectedDate = dateKey;
                saveState();
                renderDateNav();
                renderTimeline();
            };
            nav.appendChild(btn);
        });
    }

    // 渲染天氣預報卡片
    function renderWeather() {
        const card = document.getElementById("weather-card");
        const info = weatherData[appState.selectedDate] || { icon: "🌤️", temp: "--°C", status: "資料讀取中", pop: "0%", tip: "" };

        card.innerHTML = `
            <div class="weather-main">
                <div class="weather-icon">${info.icon}</div>
                <div>
                    <div class="weather-temp">${info.temp}</div>
                    <div class="weather-status">${info.status} ｜ ☔ 降雨率 ${info.pop}</div>
                </div>
            </div>
            <div class="weather-tip">${info.tip}</div>
        `;
    }

    function renderTimeline() {
        renderWeather(); // 渲染天氣

        const summaryBox = document.getElementById("day-summary");
        summaryBox.textContent = daySummaries[appState.selectedDate] || "";

        const container = document.getElementById("timeline");
        container.innerHTML = "";
        const items = appState.itinerary[appState.selectedDate] || [];

        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "item-card";
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.searchQuery || item.title)}`;

            card.innerHTML = `
                <div class="time-badge">${item.time}</div>
                <div class="spot-name">${item.title}</div>
                <div class="traffic-box">${item.traffic.replace(/\n/g, '<br>')}</div>
                <div class="notes-box">${item.notes.replace(/\n/g, '<br>')}</div>
                <div class="card-actions">
                    <a href="${mapUrl}" target="_blank" class="btn-map">📍 地圖導航</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function init() {
        loadState();
        renderDateNav();
        renderTimeline();
    }

    init();
</script>
</body>
</html>
